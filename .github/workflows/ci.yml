name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high          # fails on any known high or critical vulnerability
      - run: npm run bundle --workspace apps/api   # catches bundling problems before a release does
      - run: npm run build --workspace apps/web
      - run: docker compose --env-file .env.example config -q
