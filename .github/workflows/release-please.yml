# Keeps a "release PR" open on main. It proposes the next version from the Conventional Commit messages,
# updates CHANGELOG.md and package.json, and on merge creates the vX.Y.Z tag and the GitHub release.
name: release-please
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
